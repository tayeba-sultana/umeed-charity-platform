<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Manage News - Admin</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <header>
        <h1>Manage News</h1>
        <nav>
            <a href="index.html">Overview</a>
            <a href="campaigns.html">Campaigns</a>
            <a href="blood.html">Blood Donations</a>
            <a href="volunteers.html">Volunteers</a>
            <a href="news.html" class="active">News</a>
            <a href="faq.html">FAQs</a>
            <a href="messages.html">Messages</a>
            <a href="#" onclick="logout()">Logout</a>
        </nav>
    </header>

    <main class="dashboard-content">
        <section class="add-section">
            <h3>Publish News Article</h3>
            <form id="addNewsForm">
                <input type="text" id="newsTitle" placeholder="Article Title" required>
                <textarea id="newsContent" placeholder="Article Content" required></textarea>
                <button type="submit">Publish News</button>
            </form>
        </section>

        <section class="list-section">
            <h3>Published Articles</h3>
            <table border="1" id="newsTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Content</th>
                    </tr>
                </thead>
                <tbody></tbody>
            </table>
        </section>
    </main>

    <script>
        async function loadNews() {
            const res = await fetch('../backend/admin/api.php?action=get_news');
            const articles = await res.json();
            const tbody = document.querySelector('#newsTable tbody');
            tbody.innerHTML = '';

            if (Array.isArray(articles)) {
                articles.forEach(item => {
                    tbody.innerHTML += `
                        <tr>
                            <td>${item.id}</td>
                            <td>${item.title}</td>
                            <td>${item.content}</td>
                        </tr>`;
                });
            }
        }

        document.getElementById('addNewsForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData();
            formData.append('title', document.getElementById('newsTitle').value);
            formData.append('content', document.getElementById('newsContent').value);

            const res = await fetch('../backend/admin/api.php?action=add_news', {
                method: 'POST',
                body: formData
            });
            const data = await res.json();

            if (data.status === 'success') {
                alert('News article added!');
                document.getElementById('addNewsForm').reset();
                loadNews();
            } else {
                alert('Error adding news article.');
            }
        });

        async function logout() {
            await fetch('../backend/admin/api.php?action=logout');
            window.location.href = 'login.html';
        }

        loadNews();
    </script>
</body>
</html>
