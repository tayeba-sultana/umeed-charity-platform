<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Umeed Admin Login</title><link rel="stylesheet" href="../css/style.css"></head><body><main id="app"><section><div class="container"><div class="form-card auth-card"><div id="alert" hidden></div><h1>Admin Login</h1><p class="helper-text">Umeed administration panel.</p><form id="f"><div class="form-group"><label>Email</label><input type="email" name="email" value="admin@umeed.org" required></div><div class="form-group"><label>Password</label><input type="password" name="password" value="admin123" required></div><button class="btn btn-primary btn-block">Log in</button></form><p style="margin-top:18px"><a href="../index.html">Back to website</a></p></div></div></section></main><script src="../js/script.js"></script><script>document.getElementById('f').onsubmit=async e=>{e.preventDefault();try{await api('login',Object.fromEntries(new FormData(e.target)));const s=await getSession();if(s.user.role!=='admin')throw new Error('This account is not an administrator.');location.href='index.html'}catch(x){setAlert(x.message,'error')}}</script></body></html>
